[project]
name = "python-game-simulations"
version = "0.1.0"
description = "RPG / Game Simulation Projects (Umbrella)"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
